; ============================================================
; PlatformIO — WT32-ETH01 V1.4 (Telemetría Marítima)
; ============================================================
; Placa: WT32-ETH01 (ESP32 + LAN8720 Ethernet)
; Programador: FT232RL YP-05 (USB-C) — solo para flashear
; ============================================================

[platformio]
; El sketch principal (.ino) está en la raíz del proyecto
src_dir = .
; Solo el entorno de cable se ejecuta con "Upload" (el OTA se elige aparte)
default_envs = wt32-eth01

[env:wt32-eth01]
platform = espressif32
board = wt32-eth01
framework = arduino

; ── Velocidades (estabilidad con chip FT232RL) ─────────────
upload_speed = 115200
monitor_speed = 115200

; ── Librerías ───────────────────────────────────────────────
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson@^7.0.0

; ════════════════════════════════════════════════════════════
; Entorno para actualizar por RED (OTA) — SIN YP-05
; Después del primer flasheo por cable, usa este entorno.
; ════════════════════════════════════════════════════════════
[env:wt32-eth01-ota]
platform = espressif32
board = wt32-eth01
framework = arduino
upload_protocol = espota
upload_port = 192.168.1.49
upload_speed = 921600
monitor_speed = 115200
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson@^7.0.0
